<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="main-content">
      <article class="card">
        <img
          src="./assets/images/illustration-article.svg"
          alt="Illustration Article"
        />
        <span class="card__category">Learning</span>
        <time class="card__date" datetime="2023-12-21"
          >Published 21 Dec 2023</time
        >
        <h1 class="card__title"><a href="#">HTML &amp; CSS foundations</a></h1>
        <p class="card__description">
          These languages are the backbone of every website, defining structure,
          content, and presentation. Greg Hooper
        </p>
        <footer class="card__footer">
          <img src="./assets/images/image-avatar.webp" />
          <span>Greg Hooper</span>
        </footer>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Rawda</a>.
    </footer>
  </body>
</html>
